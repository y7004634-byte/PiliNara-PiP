name: Build YouMod zh-Hant + custom PiP

on:
  workflow_dispatch:
  push:
    branches: [youmod-localization-build]

permissions:
  contents: read

concurrency:
  group: youmod-localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout patcher
        uses: actions/checkout@v4
        with:
          ref: youmod-localization-build

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install opencc make ldid dpkg
          pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Download exact YouMod 21.37.4 release
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o base.ipa \
            https://github.com/jaydenjcpy/YouMod/releases/download/youmod-ipa35/YouMod_21.37.4_v2.0.0.ipa
          echo "ee9e487ebec3589fb7ca37a0ac37377348b4a4dc6783efa4fd783dc96c0d53c7  base.ipa" | shasum -a 256 -c -

      - name: Setup Theos and headers
        shell: bash
        run: |
          set -euo pipefail
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"

          git clone --quiet --depth=1 --recurse-submodules https://github.com/roothide/theos.git theos
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS26.5.sdk
          git checkout --quiet
          mv *.sdk "${{ github.workspace }}/theos/sdks"
          cd "${{ github.workspace }}"

          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "${{ github.workspace }}/theos/include/YouTubeHeader"
          git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git "${{ github.workspace }}/theos/include/PSHeader"

      - name: Clone current tweak sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch v1.3.3 https://github.com/candyzp/VolumeBoostYT.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/YTABConfig.git

      - name: Apply user source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_youmod_sources.py VolumeBoostYT YouPiP YTABConfig

          grep -Fq '右側滑動' VolumeBoostYT/Tweak.x
          grep -Fq '音量增益' VolumeBoostYT/YTVolumeHUD.m
          grep -Fq 'YOUMOD_USER_PIP_SKIP_60' YouPiP/Tweak.x
          grep -Fq 'customSeconds = requestedSeconds < 0.0 ? -60.0 : 60.0' YouPiP/Tweak.x
          grep -Fq 'YTABC.YTColdConfig.enableRepeatChapterSnackbarController' YTABConfig/Settings.x
          grep -Fq 'YTABC.YTColdConfig.iosEnableSwitchChapterOnChapterRepeating' YTABConfig/Settings.x

      - name: Build customized tweaks
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="${{ github.workspace }}/theos"

          cd "${{ github.workspace }}/VolumeBoostYT"
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          cd "${{ github.workspace }}/YouPiP"
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cd "${{ github.workspace }}/YTABConfig"
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cd "${{ github.workspace }}"

          VOL_DEB="$(find VolumeBoostYT/packages -type f -name '*.deb' | head -n 1)"
          PIP_DEB="$(find YouPiP/packages -type f -name '*.deb' | head -n 1)"
          ABC_DEB="$(find YTABConfig/packages -type f -name '*.deb' | head -n 1)"
          test -f "$VOL_DEB"
          test -f "$PIP_DEB"
          test -f "$ABC_DEB"
          printf 'VolumeBoost=%s\nYouPiP=%s\nYTABConfig=%s\n' "$VOL_DEB" "$PIP_DEB" "$ABC_DEB" | tee custom-debs.txt

      - name: Replace tweak binaries without re-injecting load commands
        shell: bash
        run: |
          set -euo pipefail
          VOL_DEB="$(find VolumeBoostYT/packages -type f -name '*.deb' | head -n 1)"
          PIP_DEB="$(find YouPiP/packages -type f -name '*.deb' | head -n 1)"
          ABC_DEB="$(find YTABConfig/packages -type f -name '*.deb' | head -n 1)"

          rm -rf work debx
          mkdir -p work debx/vol debx/pip debx/abc
          ditto -x -k base.ipa work
          APP="$(find work/Payload -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP"

          shasum -a 256 "$APP/YouTube" | tee main-executable-before.txt

          dpkg-deb -x "$VOL_DEB" debx/vol
          dpkg-deb -x "$PIP_DEB" debx/pip
          dpkg-deb -x "$ABC_DEB" debx/abc

          VOL_DYLIB="$(find debx/vol -type f -name 'VolumeBoostYT.dylib' | head -n 1)"
          PIP_DYLIB="$(find debx/pip -type f -name 'YouPiP.dylib' | head -n 1)"
          ABC_DYLIB="$(find debx/abc -type f -name 'YTABConfig.dylib' | head -n 1)"
          test -f "$VOL_DYLIB"
          test -f "$PIP_DYLIB"
          test -f "$ABC_DYLIB"

          cp "$VOL_DYLIB" "$APP/Frameworks/VolumeBoostYT.dylib"
          cp "$PIP_DYLIB" "$APP/Frameworks/YouPiP.dylib"
          cp "$ABC_DYLIB" "$APP/Frameworks/YTABConfig.dylib"
          chmod 755 "$APP/Frameworks/VolumeBoostYT.dylib" "$APP/Frameworks/YouPiP.dylib" "$APP/Frameworks/YTABConfig.dylib"

          # Critical regression guard: the base IPA already has these LC_LOAD_WEAK_DYLIB
          # commands. Re-injecting the same tweaks adds duplicate load commands and can
          # crash the app at launch. The main executable must remain byte-identical.
          shasum -a 256 "$APP/YouTube" | tee main-executable-after.txt
          cmp main-executable-before.txt main-executable-after.txt

          otool -L "$APP/YouTube" > loaded-dylibs.txt
          for name in VolumeBoostYT YouPiP YTABConfig; do
            count="$(grep -c "@rpath/$name.dylib" loaded-dylibs.txt)"
            echo "$name load-command-count=$count"
            test "$count" -eq 1
          done

          test -d "$APP/PlugIns/OpenYouTubeSafariExtension.appex"

      - name: Apply Traditional Chinese resource patch
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find work/Payload -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP"

          python3 tools/patch_youmod_zhhant.py "$APP"

          python3 - "$APP" <<'PY'
          from pathlib import Path
          import plistlib, subprocess, sys
          app = Path(sys.argv[1])

          def load(path):
              with path.open("rb") as f:
                  return plistlib.load(f)

          def count(path):
              return len(load(path))

          checks = [
              ("YouMod.bundle", 559),
              ("Gonerino.bundle", 74),
              ("YouGroupSettings.bundle", 1),
          ]
          for bundle, expected in checks:
              en = app / bundle / "en.lproj" / "Localizable.strings"
              zh = app / bundle / "zh-Hant.lproj" / "Localizable.strings"
              assert en.exists() and zh.exists(), (bundle, "missing localization")
              en_count = count(en)
              zh_count = count(zh)
              assert en_count == zh_count, (bundle, en_count, zh_count)
              assert zh_count >= expected, (bundle, zh_count, expected)
              print(f"{bundle}: en={en_count} zh-Hant={zh_count}")

          ytu = load(app / "YTUHD.bundle" / "zh-Hant.lproj" / "Localizable.strings")
          assert ytu["SKIP_LOOP_FILTER"] == "跳過迴圈濾波"
          assert ytu["LOOP_FILTER_OPTIMIZATION"] == "迴圈濾波最佳化"
          assert ytu["ROW_THREADING"] == "列多執行緒處理"
          assert ytu["HW_VP9_SUPPORT"] == "硬體 VP9 解碼支援"
          assert ytu["HW_AV1_SUPPORT"] == "硬體 AV1 解碼支援"

          aliases = [
              "DontEatMyContent.bundle", "RYD.bundle", "YTUHD.bundle",
              "YTVideoOverlay.bundle", "YTWKS.bundle", "YTABC.bundle",
              "YouPiP.bundle", "YouSlider.bundle",
          ]
          for bundle in aliases:
              p = app / bundle / "zh-Hant.lproj" / "Localizable.strings"
              assert p.exists(), (bundle, "zh-Hant alias missing")

          appex = list(app.glob("PlugIns/OpenYouTubeSafariExtension.appex"))
          assert appex, "Safari extension was not preserved"

          fw = app / "Frameworks"
          vol = fw / "VolumeBoostYT.dylib"
          pip = fw / "YouPiP.dylib"
          abc = fw / "YTABConfig.dylib"
          assert vol.exists() and pip.exists() and abc.exists()

          # VolumeBoostYT user-visible strings are Objective-C CFStrings and are
          # not reliably emitted by the command-line strings tool as UTF-8.
          # Source-level translation was asserted before compilation; here verify
          # the rebuilt dylib is present and non-empty.
          assert vol.stat().st_size > 0
          assert pip.stat().st_size > 0

          abc_strings = subprocess.check_output(["strings", str(abc)], text=True, errors="ignore")
          assert "YTABC.YTColdConfig.enableRepeatChapterSnackbarController" in abc_strings
          assert "YTABC.YTColdConfig.iosEnableSwitchChapterOnChapterRepeating" in abc_strings

          print("custom tweak and localization checks passed")
          PY

      - name: Repack final IPA
        shell: bash
        run: |
          set -euo pipefail
          OUT="YouMod_21.37.4_v2.0.0_zhHant_VolumeBoostYT-1.3.3_PiP60.ipa"
          (
            cd work
            zip -qry -y "../$OUT" Payload
          )

          {
            echo "base_youmod=21.37.4_v2.0.0"
            echo "volume_boost=1.3.3"
            echo "volume_boost_ui=zh-Hant source rebuild"
            echo "pip_skip_backward_seconds=60"
            echo "pip_skip_forward_seconds=60"
            echo "chapter_repeat_snackbar_default=1"
            echo "switch_chapter_while_repeating_default=0"
            echo "ytuhd_zh_hant=completed"
          } | tee build-info.txt

          shasum -a 256 "$OUT" | tee final-sha256.txt
          ls -lh "$OUT"

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: YouMod-21.37.4-zhHant-VolBoost1.3.3-PiP60
          path: |
            YouMod_21.37.4_v2.0.0_zhHant_VolumeBoostYT-1.3.3_PiP60.ipa
            build-info.txt
            custom-debs.txt
            final-sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
