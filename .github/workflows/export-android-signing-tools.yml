name: Export Android signing tools

on:
  push:
    paths:
      - ".github/workflows/export-android-signing-tools.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package latest Android build-tools signer
        run: |
          set -e
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "Using $BT"
          mkdir -p signing-tools/lib
          cp "$BT/apksigner" signing-tools/
          cp "$BT/zipalign" signing-tools/
          cp "$BT/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
          "$BT/apksigner" version
          "$BT/zipalign" -h >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v7
        with:
          name: android-signing-tools-linux
          path: signing-tools
