name: Build PiliNara Android zh-TW + PiP + Backup

on:
  workflow_dispatch:
  push:
    paths:
      - "build-android.sh"
      - "apply_settings_backup_patch.py"
      - "translate_source_zh_tw.py"
      - ".github/workflows/build-android-tw.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Build Android arm64 APK
        run: |
          chmod +x build-android.sh
          ./build-android.sh

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          name: PiliNara-Android-arm64-zhTW-PiP-Backup
          path: PiliNara_android_2.1.3_TW_PiP_Backup_5860_arm64-v8a.apk
