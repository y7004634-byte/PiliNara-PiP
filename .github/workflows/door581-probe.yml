name: Door Map Planner Shell

on:
  push:
    branches: [door581-planner-v0372]
    paths:
      - 'door581-probe/**'
      - '.github/workflows/door581-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: door581-planner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct pinned original and apply narrow native patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .door581-build
          cat door581-probe/source.part* > .door581-build/source.b64
          python3 - <<'PY'
          import base64, hashlib, pathlib
          root=pathlib.Path('.door581-build')
          raw=base64.b64decode(root.joinpath('source.b64').read_bytes(),validate=True)
          sha=hashlib.sha256(raw).hexdigest()
          assert sha=='075815c34cb4d8b9270343555135d62500558fd1a83ccf55e93e8e57975137a8',sha
          root.joinpath('source.zip').write_bytes(raw)
          print('VERIFIED BASE SOURCE',sha)
          PY
          unzip -q .door581-build/source.zip -d .door581-build
          SOURCE=.door581-build/581_DoorMap_Probe_v0.0.1
          python3 door581-probe/v002_patch.py "$SOURCE"
          python3 door581-probe/v005_waze_patch.py "$SOURCE"
          python3 door581-probe/v006_planner_patch.py "$SOURCE"
      - name: Test and build unsigned iPhone shell
        shell: bash
        run: |
          set -euo pipefail
          cd .door581-build/581_DoorMap_Probe_v0.0.1
          bash tools/build_ipa.sh
          zip -qr artifacts/DoorMap-v0.0.6-native-source.zip Door581Probe Tests tools docs Door581Probe.xcodeproj
      - name: Upload IPA and reproducible source/evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DoorMap-v0.0.6-build7-planner-shell
          path: .door581-build/581_DoorMap_Probe_v0.0.1/artifacts/
          if-no-files-found: error
          retention-days: 14
